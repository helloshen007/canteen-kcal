worker_processes 1;
pid /tmp/spaces-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 11m;
    client_body_temp_path /tmp/spaces-body;
    proxy_temp_path /tmp/spaces-proxy;
    fastcgi_temp_path /tmp/spaces-fastcgi;
    uwsgi_temp_path /tmp/spaces-uwsgi;
    scgi_temp_path /tmp/spaces-scgi;
    map $http_x_forwarded_proto $public_scheme {
        default https;
        http http;
    }
    limit_req_zone $binary_remote_addr zone=auth:10m rate=6r/m;
    server {
        listen 7860;
        location /api/auth/ {
            limit_req zone=auth burst=8 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
