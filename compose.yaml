name: canteen-kcal

x-app: &app
  image: canteen-kcal:stage3
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: &environment
    REDIS_URL: redis://redis:6379/0
    CANTEEN_STATE_DIR: /app/var
    CANTEEN_MODEL_DIR: /app/models
    APP_SECRET_KEY: ${APP_SECRET_KEY:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-0}
    VLM_PROVIDER: ${VLM_PROVIDER:-openai}
    VLM_BASE_URL: ${VLM_BASE_URL:-https://api.deepseek.com}
    VLM_MODEL: ${VLM_MODEL:-deepseek-flash}
    VLM_DISABLE_THINKING: ${VLM_DISABLE_THINKING:-1}
    VLM_API_KEY: ${VLM_API_KEY:-}
  volumes:
    - state:/app/var
    - models:/app/models
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - backend

services:
  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    volumes:
      - queue:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    build: .
    volumes:
      - state:/app/var
      - models:/app/models:ro
    environment:
      <<: *environment
      # The API only reports configuration readiness; secrets are used by worker.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  worker:
    <<: *app
    pull_policy: never
    command: ["python", "-m", "web.worker"]
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "python", "-c", "from rq import Worker; import socket; from web.config import Settings; from web.queue import connection; assert any(w.hostname == socket.gethostname() for w in Worker.all(connection=connection(Settings())))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  nginx:
    image: canteen-kcal-nginx:stage3
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  state:
  models:
  queue:

networks:
  backend:
